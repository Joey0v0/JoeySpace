app:
  env: "debug"               # debug | release
  server_id: 1               # 用于 Snowflake ID 生成

api_server:
  port: 8080

ws_server:
  port: 8081
  rpc_port: 9091             # 用于接收内部 push 请求的 HTTP/RPC 端口

mysql:
  dsn: "root:root123@tcp(localhost:3306)/go_im?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 20

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

kafka:
  brokers: ["localhost:9092"]
  topic_chat: "chat_messages"
  consumer_group: "im_push_group"
  # 022 migration and the later Agent consumer must be ready before enabling.
  agent_trigger_enabled: false
  topic_agent_trigger: "agent_task_triggers"

# Optional stage 7 online hints. Prepare private certificates before enabling.
task_notifications:
  push:
    enabled: false
    topic: "task_notifications"
    consumer_group: "task_notification_push_group"
    ws_dns_name: "ws.go-im.internal"
    routes:
      "localhost:9091": "https://localhost:9443"
    tls:
      cert_file: ""
      key_file: ""
      ca_file: ""
  ws:
    enabled: false
    listen_addr: "127.0.0.1:9443"
    push_dns_name: "push.go-im.internal"
    user_rpc_addr: "localhost:9001"
    tls:
      cert_file: ""
      key_file: ""
      ca_file: ""

jwt:
  secret: "im_super_secret_key"
  access_expire_hours: 24
  refresh_expire_hours: 168

log:
  level: "debug"
  filename: "./logs/go-im.log"
