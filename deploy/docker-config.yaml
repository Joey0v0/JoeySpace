# Template only: copy to docker-config.local.yaml and fill credentials locally.
app:
  env: "release"
  server_id: 1

api_server:
  port: 8080

ws_server:
  port: 8081
  rpc_port: 9091

mysql:
  dsn: "root:CHANGE_ME_MYSQL_PASSWORD@tcp(mysql:3306)/go_im?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 20

redis:
  addr: "redis:6379"
  password: ""
  db: 0

kafka:
  brokers: ["kafka:19092"]
  topic_chat: "chat_messages"
  consumer_group: "im_push_group"
  # 022 migration and the later Agent consumer must be ready before enabling.
  agent_trigger_enabled: false
  topic_agent_trigger: "agent_task_triggers"

# Optional stage 7 online hints. Enable only in private YAML with mounted certs.
task_notifications:
  push:
    enabled: false
    topic: "task_notifications"
    consumer_group: "task_notification_push_group"
    ws_dns_name: "ws.go-im.internal"
    routes:
      "im-ws:9091": "https://im-ws:9443"
    tls:
      cert_file: "/app/certs/push-notification/cert.pem"
      key_file: "/app/certs/push-notification/key.pem"
      ca_file: "/app/certs/push-notification/ca.pem"
  ws:
    enabled: false
    listen_addr: "0.0.0.0:9443"
    push_dns_name: "push.go-im.internal"
    user_rpc_addr: "user-rpc:9001"
    tls:
      cert_file: "/app/certs/ws-notification/cert.pem"
      key_file: "/app/certs/ws-notification/key.pem"
      ca_file: "/app/certs/ws-notification/ca.pem"

jwt:
  secret: "CHANGE_ME_JWT_SECRET"
  access_expire_hours: 24
  refresh_expire_hours: 168

log:
  level: "info"
  filename: "./logs/go-im.log"
