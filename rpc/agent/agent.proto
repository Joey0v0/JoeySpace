syntax = "proto3";

package agent;

option go_package = "github.com/yjydist/go-im/rpc/agent/pb";

service Agent {
  // authorization: Bearer <token> 经 gRPC metadata 传入；第一版只读问答。
  rpc Ask(AskRequest) returns (AskResponse);
  // 仅草稿发起人可读取；每次读取都重新校验当前团队群资格。
  rpc GetTaskDraft(GetTaskDraftRequest) returns (GetTaskDraftResponse);
  // 显式生成一项待确认草稿；authorization 与 idempotency-key 经 metadata 传入。
  rpc PrepareTaskDraft(PrepareTaskDraftRequest) returns (PrepareTaskDraftResponse);
  // 仅发起人可修改待确认草稿的标题和说明；每次重新校验当前团队群资格。
  rpc EditTaskDraft(EditTaskDraftRequest) returns (GetTaskDraftResponse);
  // 本人明确选择当前团队成员或未指派；必须携带读取的内容版本。
  rpc SelectTaskDraftAssignee(SelectTaskDraftAssigneeRequest) returns (GetTaskDraftResponse);
  // 本人编辑已保存草稿截止时间；0 明确清除，缺字段拒绝，冻结后不可改。
  rpc EditTaskDraftDeadline(EditTaskDraftDeadlineRequest) returns (GetTaskDraftResponse);
  // 仅发起人可确认；冻结内容及服务端请求键，重复请求复用原任务。
  rpc ConfirmTaskDraft(ConfirmTaskDraftRequest) returns (GetTaskDraftResponse);
  // 仅本人显式重试原回帖；不重新创建任务，不接受任意正文或群范围。
  rpc RetryTaskReply(GetTaskDraftRequest) returns (GetTaskDraftResponse);
}

message AskRequest {
  int64 team_id = 1;
  int64 group_id = 2;
  string question = 3;
}

message AskResponse {
  string answer = 1;
}

message GetTaskDraftRequest {
  int64 run_id = 1;
}

message GetTaskDraftResponse {
  int64 run_id = 1;
  int64 team_id = 2;
  int64 group_id = 3;
  string status = 4;
  TaskDraftItem draft = 5;
  // 仅创建结果已持久保存时为正整数；其他状态为 0。
  int64 task_id = 6;
  // disabled / not_started / pending / accepted；unknown 仅用于确认后的存储不确定结果。
  // accepted 只表示 IM 已受理，不表示历史已入库或所有成员送达。
  string reply_status = 7;
  string reply_msg_id = 8;
}

message TaskDraftItem {
  string title = 1;
  string description = 2;
  int64 assignee_id = 3;
  int64 due_at_unix_ms = 4;
  int64 source_message_id = 5;
  // 原始称呼；空值的旧草稿仍兼容，不是模型生成的真实身份。
  string assignee_name = 6;
  // 旧草稿为空；提取结果为 none/matched/not_found/ambiguous/truncated。
  // 本人选择后为 selected/unassigned，保留原称呼；确认须审查该负责人。
  string assignee_resolution = 7;
  // 正整数内容版本；实际编辑才递增，任务冻结/创建/回帖不递增。
  int64 revision = 8;
  // 旧草稿缺失；新草稿包含原始依据和当前本人处理状态。
  TaskDraftDeadline deadline = 9;
}

message TaskDraftDeadline {
  string text = 1;
  string source = 2; // none / instruction / message
  int64 source_message_id = 3;
  int64 reference_unix_ms = 4;
  string timezone = 5;
  string resolution = 6; // none / parsed / needs_input / selected / unset
  string reason = 7;
  int64 parsed_unix_ms = 8; // 原解析候选，不随本人编辑改变
  int64 instruction_reference_unix_ms = 9;
}

message PrepareTaskDraftRequest {
  int64 team_id = 1;
  int64 group_id = 2;
  string instruction = 3;
  // 首次提交固定的指令时间解释输入；同键重试须保持，不作为授权或审计时间。
  // 缺失保留旧请求摘要；存在时必须为合法正 UTC Unix 毫秒。
  optional int64 instruction_reference_unix_ms = 4;
}

message PrepareTaskDraftResponse {
  int64 run_id = 1;
}

message EditTaskDraftRequest {
  int64 run_id = 1;
  string title = 2;
  string description = 3;
  string expected_title = 4;
  string expected_description = 5;
  // 必须提交上次读取的内容版本；缺失或零值拒绝写入。
  int64 expected_revision = 6;
}

message ConfirmTaskDraftRequest {
  int64 run_id = 1;
  string expected_title = 2;
  string expected_description = 3;
  int64 expected_revision = 4;
  // named/selected/unassigned 草稿必须明确提交；0 表示审查了未指派。
  // 旧客户端缺字段仅可确认旧草稿或 none，不能绕过负责人审查。
  optional int64 expected_assignee_id = 5;
  // 新页面始终审查截止时间；非零截止时间须明确提供，缺失不默认零。
  optional int64 expected_due_at_unix_ms = 6;
  // 新依据草稿必须明确审查状态；旧草稿为空仍兼容。
  string expected_deadline_resolution = 7;
}

message SelectTaskDraftAssigneeRequest {
  int64 run_id = 1;
  // 必须存在；0 表示本人明确选择未指派，正数由 User 检查当前资格。
  optional int64 assignee_id = 2;
  int64 expected_revision = 3;
}

message EditTaskDraftDeadlineRequest {
  int64 run_id = 1;
  optional int64 due_at_unix_ms = 2;
  int64 expected_revision = 3;
}
