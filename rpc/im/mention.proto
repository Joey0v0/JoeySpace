syntax = "proto3";

package im;
option go_package = "github.com/yjydist/go-im/rpc/im/pb";

// Registered only on a dedicated mTLS listener accepting the Push identity.
service IMMention {
  rpc ValidateGroupMentionTargets(ValidateGroupMentionTargetsRequest) returns (ValidateGroupMentionTargetsResponse);
}

message MentionMemberGeneration {
  int64 user_id = 1;
  int64 team_generation = 2; // Verified by User's Push-only service.
}

message ValidateGroupMentionTargetsRequest {
  int64 group_id = 1;
  MentionMemberGeneration sender = 2;
  repeated MentionMemberGeneration targets = 3; // 1..10 distinct users.
}

message ValidateGroupMentionTargetsResponse {
  int64 team_id = 1;
}
