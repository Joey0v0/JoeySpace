syntax = "proto3";

package user;
option go_package = "github.com/yjydist/go-im/rpc/user/pb";

// Only on User's dedicated mTLS port, allowing the exact trusted IM service.
// Never grants a user login or exposes profile/password/role information.
service UserTrigger {
  rpc CheckTriggerTeamMember(CheckTriggerTeamMemberRequest) returns (CheckTriggerTeamMemberResponse);
  rpc ResolveTriggerTeamMember(ResolveTriggerTeamMemberRequest) returns (ResolveTriggerTeamMemberResponse);
}

message CheckTriggerTeamMemberRequest {
  // IM derives both IDs from its persisted trigger, not Kafka or user metadata.
  int64 actor_id = 1;
  int64 team_id = 2;
}

message CheckTriggerTeamMemberResponse {
  // Echo only the checked scope. An empty or different result is not success.
  int64 actor_id = 1;
  int64 team_id = 2;
  // Current active membership generation, checked by IM against its closure.
  // Missing or non-positive values must never be treated as generation 1.
  int64 generation = 3;
}

message ResolveTriggerTeamMemberRequest {
  // IM derives scope from its persisted source and checks current group access.
  int64 actor_id = 1;
  int64 team_id = 2;
  string name = 3;
}

message TriggerTeamMemberCandidate {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
}

message ResolveTriggerTeamMemberResponse {
  int64 actor_id = 1;
  int64 team_id = 2;
  string name = 3;
  repeated TriggerTeamMemberCandidate candidates = 4;
  bool truncated = 5;
}
