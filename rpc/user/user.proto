syntax = "proto3";

package user;

option go_package = "github.com/yjydist/go-im/rpc/user/pb";

service User {
  // 固定数据的通信演示。
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  // 从 authorization metadata 验证登录身份，只查询本人。
  rpc GetMyInfo(GetMyInfoRequest) returns (GetUserInfoResponse);
  // 验证现有 users 表中的账号密码，签发兼容旧服务的 Token。
  rpc Login(LoginRequest) returns (LoginResponse);
  // 创建用户；实际写入和用户名唯一性由用户服务控制。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 用登录身份创建团队，并将创建者加入为拥有者。
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  // 仅团队拥有者可将已有的可用用户直接加入团队。
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse);
  // 仅团队成员可读取成员资料，按用户 ID 分页。
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
  // 仅团队拥有者可在普通成员与管理员之间调整角色。
  rpc SetTeamMemberRole(SetTeamMemberRoleRequest) returns (SetTeamMemberRoleResponse);
  // 验证当前登录用户是否可以在指定团队创建群。
  rpc AuthorizeTeamGroupCreation(AuthorizeTeamGroupCreationRequest) returns (AuthorizeTeamGroupCreationResponse);
  // 从登录身份检查当前用户是否仍属于指定团队，并返回已核实的身份与角色。
  rpc CheckTeamMember(CheckTeamMemberRequest) returns (CheckTeamMemberResponse);
  // 当前团队成员查询指定用户是否仍为该团队的可用成员，供任务指派使用。
  rpc CheckTeamMemberByID(CheckTeamMemberByIDRequest) returns (CheckTeamMemberByIDResponse);
  // 当前团队成员按完整用户名/昵称严格匹配启用成员；不自动决定负责人。
  rpc ResolveTeamMember(ResolveTeamMemberRequest) returns (ResolveTeamMemberResponse);
  // 仅登录本人退出团队；同一请求键可显式重试待清理操作。
  rpc LeaveTeam(LeaveTeamRequest) returns (TeamLeaveOperationResponse);
  // 回包丢失后，本人可按原请求键查询固定退出操作。
  rpc GetTeamLeaveOperation(GetTeamLeaveOperationRequest) returns (TeamLeaveOperationResponse);
  // 登录本人分页读取当前活动团队；不能代填 user_id。
  rpc ListMyTeams(ListMyTeamsRequest) returns (ListMyTeamsResponse);
  // 仅供 Gateway 对 IM 已核实的私聊对象补有限显示名；不开放任意 HTTP 查询。
  rpc BatchGetConversationDisplayNames(BatchGetConversationDisplayNamesRequest) returns (BatchGetConversationDisplayNamesResponse);
  // 当前团队成员为 Task 已返回的当前页成员补有限显示名。
  rpc BatchGetTeamMemberDisplayNames(BatchGetTeamMemberDisplayNamesRequest) returns (BatchGetTeamMemberDisplayNamesResponse);
  // 登录本人为 Task 已返回的当前页团队补名称；仅返回仍活动的本人团队。
  rpc BatchGetMyTeamNames(BatchGetMyTeamNamesRequest) returns (BatchGetMyTeamNamesResponse);
}

message ListMyTeamsRequest {
  int64 after_team_id = 1;
  int32 limit = 2;
}

message MyTeam {
  int64 team_id = 1;
  string name = 2;
  int32 role = 3;
}

message ListMyTeamsResponse {
  repeated MyTeam teams = 1;
  int64 next_after_team_id = 2;
}

message BatchGetConversationDisplayNamesRequest {
  repeated int64 user_ids = 1; // 最多 100 个正 ID。
}

message ConversationDisplayName {
  int64 user_id = 1;
  string display_name = 2; // 昵称优先、用户名兜底；无可用资料时不返回该 ID。
}

message BatchGetConversationDisplayNamesResponse {
  repeated ConversationDisplayName users = 1;
}
message BatchGetTeamMemberDisplayNamesRequest {
  int64 team_id = 1;
  repeated int64 user_ids = 2; // 去重后最多 100 个正 ID。
}

message TeamMemberDisplayName {
  int64 user_id = 1;
  string display_name = 2; // 昵称优先、用户名兜底。
}

message BatchGetTeamMemberDisplayNamesResponse {
  repeated TeamMemberDisplayName users = 1;
}

message BatchGetMyTeamNamesRequest {
  repeated int64 team_ids = 1; // 去重后最多 100 个正 ID。
}

message MyTeamName {
  int64 team_id = 1;
  string name = 2;
}

message BatchGetMyTeamNamesResponse {
  repeated MyTeamName teams = 1;
}

message LeaveTeamRequest {
  int64 team_id = 1;
  string request_key = 2; // 1—64 位 ASCII 字母、数字、- 或 _。
}

message GetTeamLeaveOperationRequest {
  int64 team_id = 1;
  string request_key = 2;
}

message TeamLeaveOperationResponse {
  int64 operation_id = 1;
  int64 team_id = 2;
  int64 generation = 3;
  int32 status = 4; // 0：待清理（可同键重试）；1：已完成。
}

message ResolveTeamMemberRequest {
  int64 team_id = 1;
  // 去除输入首尾空白后匹配，1—64 个 Unicode 字符；区分大小写与重音。
  string name = 2;
}

message ResolveTeamMemberResponse {
  // 按用户 ID 升序，最多 20 个。同一成员匹配两个字段也只出现一次。
  repeated TeamMember candidates = 1;
  // 还有未返回的匹配成员；仅候选数为 1 且本字段为 false 才能判断唯一。
  bool truncated = 2;
}

message CheckTeamMemberRequest {
  int64 team_id = 1;
}

message CheckTeamMemberResponse {
  int64 user_id = 1;
  int32 role = 2; // 0 普通成员、1 管理员、2 拥有者。
  // 当前活动资格版本；跨服务退出/重入时不可重置，非正数不能用于版本授权。
  int64 generation = 3;
}

message CheckTeamMemberByIDRequest {
  int64 team_id = 1;
  int64 user_id = 2;
}

message CheckTeamMemberByIDResponse {}

message AuthorizeTeamGroupCreationRequest {
  int64 team_id = 1;
}

message AuthorizeTeamGroupCreationResponse {
  int64 user_id = 1;
  int64 generation = 2;
}

message SetTeamMemberRoleRequest {
  int64 team_id = 1;
  int64 user_id = 2;
  int32 role = 3; // 只允许 0 普通成员或 1 管理员。
}

message SetTeamMemberRoleResponse {}

message ListTeamMembersRequest {
  int64 team_id = 1;
  int64 after_user_id = 2;
  int32 limit = 3;
}

message TeamMember {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  int32 role = 4;
}

message ListTeamMembersResponse {
  repeated TeamMember members = 1;
  int64 next_after_user_id = 2;
}

message AddTeamMemberRequest {
  int64 team_id = 1;
  int64 user_id = 2;
}

message AddTeamMemberResponse {}

message CreateTeamRequest {
  string name = 1;
}

message CreateTeamResponse {
  int64 team_id = 1;
}

message GetMyInfoRequest {}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
}

message RegisterResponse {}

message GetUserInfoRequest {
  // 演示用户 ID 固定为 1；此字段不构成用户身份证明。
  int64 user_id = 1;
}

message GetUserInfoResponse {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
}
